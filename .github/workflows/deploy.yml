name: Deploy Metal Life

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metallife-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure restricted SSH key
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > "$HOME/.ssh/metallife_deploy"
          printf '%s\n' '${{ secrets.DEPLOY_KNOWN_HOSTS }}' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/metallife_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy Metal Life only
        shell: bash
        run: |
          ssh \
            -T \
            -i "$HOME/.ssh/metallife_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -p 22 \
            root@89.116.74.235
